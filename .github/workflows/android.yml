name: Build android

on:
  
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.7

      - name: Setup Java (Android 构建)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      # 双内核绑定到同一个 AAR（单 Go 运行时）：
      #   - sing-box libbox：v1.12.14 官方源码直接绑定——但必须用官方指定的
      #     sagernet/gomobile v0.1.8 fork（libbox 的 API 官方 gobind 绑不了，
      #     会报 "no exported names"），参数对齐官方 build_libbox
      #   - mihomo：自写桥（apps/mobile/core/mihomocore）
      #   - -javapkg=io.nekohasekai：libbox → io.nekohasekai.libbox，
      #     mihomocore → io.nekohasekai.mihomocore
      - name: Build Go bindings AAR (libbox + mihomo bridge)
        run: |
          export PATH="${PATH}:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)"
          echo "Using NDK: ${ANDROID_NDK_HOME}"
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init
          mkdir -p "${GITHUB_WORKSPACE}/apps/mobile/android/app/libs"
          cd apps/mobile/core
          # 注意顺序：先 tidy 归一化，再 go get 补回 bind 流程所需的依赖
          # （tidy 会剪掉模块源码未 import 的依赖，但 gomobile bind 生成的
          # 代码 import sagernet/gomobile/bind，且临时 go.mod 依赖 go list -m all）
          go mod tidy
          go get github.com/sagernet/sing-box@v1.12.14
          go get github.com/sagernet/gomobile@v0.1.8
          # 构建 tags 打开的 sing-box 可选包（clash_api/quic/wireguard/tor 等）
          # 也需要 go.sum 记录（tidy 不感知 build tags）
          go get github.com/sagernet/sing-box/experimental/clashapi@v1.12.14 \
                 github.com/sagernet/sing-box/dns/transport/quic@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/anytls@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/tuic@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/hysteria@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/hysteria2@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/shadowsocks@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/shadowtls@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/tor@v1.12.14 \
                 github.com/sagernet/sing-box/protocol/wireguard@v1.12.14 \
                 github.com/sagernet/sing-box/transport/wireguard@v1.12.14 \
                 github.com/sagernet/sing-box/service/resolved@v1.12.14
          # -checklinkname=0：libbox/pidfd_android.go 用 //go:linkname 引用
          # os.checkPidfdOnce（修旧版 Android seccomp pidfd 崩溃，sing-box#3233），
          # Go 1.25 链接器的 linkname 白名单会拦截并报
          # "invalid reference to os.checkPidfdOnce"（sing-box#3260），
          # 官方解法即关闭该检查
          gomobile bind -v -target android -androidapi 21 -javapkg=io.nekohasekai \
            -trimpath -buildvcs=false \
            -ldflags="-checklinkname=0" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack" \
            -o "${GITHUB_WORKSPACE}/apps/mobile/android/app/libs/libgo.aar" \
            ./mihomocore github.com/sagernet/sing-box/experimental/libbox
          ls -la "${GITHUB_WORKSPACE}/apps/mobile/android/app/libs/"

      - name: Pub get (workspace)
        run: flutter pub get

      - name: Build Android APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
        working-directory: apps/mobile

      - name: Package APKs
        shell: bash
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/*-release*.apk dist/
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-gui-android
          path: dist/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
