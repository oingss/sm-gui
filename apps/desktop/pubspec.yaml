name: sm_desktop
description: SM GUI 桌面端（Flutter / Windows）。
publish_to: 'none'
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  tray_manager: ^0.5.2
  window_manager: ^0.4.3
  sqlite3_flutter_libs: ^0.5.24
  sm_core:
    path: ../../packages/core
  sm_engine:
    path: ../../packages/core_engine
  ui_kit:
    path: ../../packages/ui_kit
  ui_desktop:
    path: ../../packages/ui_desktop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/tray_running.png
    - assets/tray_stopped.png
